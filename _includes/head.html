<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }} · {{ site.tagline }}</title>
<meta name="description" content="{{ site.description }}">
<meta property="og:title" content="{{ site.title }} · {{ site.tagline }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:image" content="{{ '/assets/img/portrait.jpg' | absolute_url }}">
<meta name="theme-color" content="#f5ead8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/organic.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/styles/base.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>
  /* Pick the style before first paint: ?style=… beats the saved choice; anything unknown falls back to Maximalism. */
  (function () {
    var ids = {{ site.data.styles | map: "id" | jsonify }}, s = null;
    window.siteStyles = { ids: ids, base: "{{ '/assets/css/styles/' | relative_url }}", v: "{{ site.time | date: '%s' }}" };
    try {
      s = new URLSearchParams(location.search).get("style");
      if (ids.indexOf(s) > -1) localStorage.setItem("style", s); else s = localStorage.getItem("style");
    } catch (e) {}
    if (ids.indexOf(s) < 0) s = "maximal";
    var h = document.documentElement;
    h.setAttribute("data-style", s);
    if (s !== "maximal") {
      h.classList.add("calm");
      document.write('<link rel="stylesheet" id="styleSheet" href="' + window.siteStyles.base + s + '.css?v=' + window.siteStyles.v + '">');
    }
  })();
</script>
