<section id="skills" class="block">
  <img class="decor d-print washed" src="{{ '/assets/img/collage/kidomaru.jpg' | relative_url }}" alt="" aria-hidden="true">
  <img class="decor d-comic washed" src="{{ '/assets/img/collage/comic4.jpg' | relative_url }}" alt="" aria-hidden="true">
  {% include section-head.html num="04" title="Skills" %}
  <div class="skills">
    {% for g in site.data.profile.skills %}<div class="skill">
      <h3 class="skill-h"><span class="accent">{{ forloop.index }}</span> {{ g.group }}</h3>
      <ul>{% for i in g.items %}<li>{{ i }}</li>{% endfor %}</ul>
    </div>{% endfor %}
  </div>
</section>
